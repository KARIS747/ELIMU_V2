<!-- notes.html - Section Saisie des Notes -->

<style>
  .notes-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .notes-table th {
    background: var(--bg-secondary);
    color: var(--text-muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.7px;
    padding: 10px 12px;
    text-align: left;
    border-bottom: 2px solid var(--border-color);
    position: sticky;
    top: 0;
    z-index: 1;
  }
  .notes-table td {
    padding: 8px 12px;
    border-bottom: 1px solid var(--border-color);
    vertical-align: middle;
  }
  .notes-table tr:hover td { background: var(--bg-hover); }

  .note-input {
    width: 72px;
    text-align: center;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    color: var(--text-primary);
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 13px;
    font-weight: 600;
    transition: border-color 0.15s;
  }
  .note-input:focus {
    outline: none;
    border-color: var(--blue-fifa);
    background: rgba(45,110,224,0.06);
  }
  .note-input.note-verte  { border-color: rgba(0,230,118,0.5);  color: var(--green-fifa); }
  .note-input.note-jaune  { border-color: rgba(255,183,77,0.5);  color: var(--yellow-fifa); }
  .note-input.note-rouge  { border-color: rgba(255,82,82,0.5);   color: var(--red-fifa); }

  .note-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
  }
</style>

<div class="animate-in" id="notes-root">

  <!-- Filtres -->
  <div class="card" style="margin-bottom:20px;">
    <div style="display:grid; grid-template-columns:1fr 1fr 1fr 1fr auto; gap:12px; align-items:end;">

      <div class="input-group" style="margin:0;">
        <label data-i18n="notes.class">Classe</label>
        <select id="notes-classe" class="input">
          <option value="">— Choisir une classe —</option>
        </select>
      </div>

      <div class="input-group" style="margin:0;">
        <label data-i18n="notes.matiere">Matière</label>
        <select id="notes-matiere" class="input" disabled>
          <option value="">— Choisir d'abord une classe —</option>
        </select>
      </div>

      <div class="input-group" style="margin:0;">
        <label data-i18n="notes.trimestre">Trimestre</label>
        <select id="notes-periode" class="input">
          <option value="Trimestre 1" data-i18n="dashboard.trimestre1">Trimestre 1</option>
          <option value="Trimestre 2" data-i18n="dashboard.trimestre2">Trimestre 2</option>
          <option value="Trimestre 3" data-i18n="dashboard.trimestre3">Trimestre 3</option>
        </select>
      </div>

      <div class="input-group" style="margin:0;">
        <label data-i18n="notes.sequence">Séquence</label>
        <select id="notes-sequence" class="input">
          <option value="1" data-i18n="dashboard.sequence1">Séquence 1</option>
          <option value="2" data-i18n="dashboard.sequence2">Séquence 2</option>
        </select>
      </div>

      <div style="padding-bottom:0;">
        <button class="btn btn-primary" id="btn-notes-charger" disabled data-i18n="notes.load">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px;"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect></svg>
          Charger
        </button>
      </div>
    </div>
  </div>

  <!-- Zone tableau des notes -->
  <div id="notes-zone">
    <div class="card" style="text-align:center; padding:60px 20px; display:flex; flex-direction:column; align-items:center;">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:16px; opacity:0.2; color:var(--text-muted);">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
      </svg>
      <div style="font-size:16px; color:var(--text-secondary);" data-i18n="notes.placeholder">
        Sélectionnez une classe, une matière, un trimestre et une séquence
      </div>
      <div style="font-size:13px; color:var(--text-muted); margin-top:6px;" data-i18n="notes.placeholder2">
        puis cliquez sur "Charger" pour afficher la liste des élèves
      </div>
    </div>
  </div>

</div>
